
services:
  servidor:
    build:
      context: .
      dockerfile: servidor/Dockerfile

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - servidor_datos:/app/servidor/datos

    restart: unless-stopped

  mitm:
    build:
      context: .
      dockerfile: mitm/Dockerfile

    environment:
      SERVIDOR_HOST: servidor
      SERVIDOR_PORT: "5000"
      MITM_PORT: "5001"

    ports:
      - "127.0.0.1:5001:5001"

    depends_on:
      - servidor

volumes:
  servidor_datos:
